[meta]
version = 1
name = "Kanagawa Dragon Mono"
description = "Monochrome Kanagawa Dragon theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#181616"
foreground = "#c5c9c5"
secondary_background = "#12120f"
border = "#282727"
accent = "#a6a69c"
accent_foreground = "#0d0c0c"

[colors.main_window]
border = "#282727"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "#282727"

[colors.accents]
blue = "#979c9f"
green = "#979c96"
magenta = "#9b989d"
orange = "#9e9a95"
purple = "#9998a0"
red = "#a29592"
yellow = "#a19e95"
cyan = "#979d9c"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#a6a69c"
danger = "colors.accents.red"
success = "colors.accents.green"
placeholder = "#625e5a"
selection = { background = "colors.core.foreground", foreground = "colors.core.accent_foreground" }

[colors.text.links]
default = "colors.accents.blue"
visited = "colors.accents.magenta"

[colors.input]
border = "colors.core.border"
border_focus = "colors.core.accent"
border_error = "colors.accents.red"

[colors.button.primary]
background = "#282727"
foreground = "colors.core.foreground"
hover = { background = "#343333" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "#dedede"
secondary_foreground = "colors.core.foreground"

[colors.list.item.selection]
background = "#282727"
foreground = "#dedede"
secondary_background = "#282727"
secondary_foreground = "colors.core.foreground"

[colors.grid.item]
background = "colors.core.secondary_background"
hover = { outline = "colors.core.accent" }
selection = { outline = "colors.core.foreground" }

[colors.scrollbars]
background = "#282727"

[colors.loading]
bar = "colors.core.accent"
spinner = "colors.core.foreground"
