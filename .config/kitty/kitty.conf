map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# kitty.conf generated by Confitty on 2026-07-29
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor

# --- Cursor ---
cursor_shape beam

# --- Scrollback ---
scrollback_lines 10000
touch_scroll_multiplier 1.5

# --- Mouse ---
underline_hyperlinks always
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.2

# --- Window Layout ---
window_border_width 0pt
window_padding_width 16
active_border_color #f5c2e7
hide_window_decorations yes

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style hidden
tab_powerline_style slanted
active_tab_foreground #cdd6f4
active_tab_background #f5c2e7
inactive_tab_foreground #9096af
inactive_tab_background #45465a

# --- Colors ---
foreground #c5c9c5
background #181616
selection_foreground #181616
selection_background #8ba4b0
color0 #0d0c0c
color1 #c4746e
color2 #8a9a7b
color3 #c4b28a
color4 #8ba4b0
color5 #a292a3
color6 #8ea4a2
color7 #c5c9c5
color8 #4a4a4a
color9 #e46876
color10 #87a987
color11 #e6c384
color12 #7fb4ca
color13 #938aa9
color14 #7aa89f
color15 #c5c9c5
cursor #73739e
cursor_text_color #1e1e2e
url_color #89b4fa

# --- Advanced ---
allow_remote_control socket-only
