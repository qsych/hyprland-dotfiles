general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = ~/hyprland-dotfiles/Wallpapers/railway.png
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 0.95
    brightness = 0.75
    vibrancy = 0.0
    zindex = 0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(166, 166, 142, 0.95)
    font_size = 128
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.7)
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%d.%m.%Y')"
    color = rgba(168, 164, 142, 0.6)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    zindex = 10
}

input-field {
    monitor =
    size = 100, 40
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = 4
    outer_color = rgba(166, 166, 156, 0.5)
    inner_color = rgba(166, 166, 156, 0.05)
    font_color = rgba(220, 215, 186, 0.9)
    font_family = JetBrains Mono Nerd Font
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span alpha="15%" size="small"></span>
    hide_input = false
    rounding = 6
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
    check_color = rgba(168, 164, 142, 0.7)
    fail_color = rgba(195, 64, 67, 0.7)
    fail_text = <span alpha="70%">Fail</span>
    capslock_color = rgba(192, 163, 110, 0.6)
    numlock_color = rgba(126, 156, 216, 0.6)
    position = 0, -100
    halign = center
    valign = center
    zindex = 10
}
